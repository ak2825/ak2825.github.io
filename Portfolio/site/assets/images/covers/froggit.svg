<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-labelledby="title">
  <title id="title">Modular pixel path with a geometric frog marker for Froggit</title>
  <defs>
    <linearGradient id="background" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#172a30"/>
      <stop offset="1" stop-color="#394d31"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#d8e6df" stroke-opacity=".11"/>
    </pattern>
  </defs>
  <rect width="320" height="320" rx="18" fill="url(#background)"/>
  <rect x="16" y="16" width="288" height="288" rx="10" fill="url(#grid)"/>
  <path d="M48 256h64v-48h48v-64h48V96h64" fill="none" stroke="#cddbd4" stroke-linecap="square" stroke-linejoin="round" stroke-width="14"/>
  <g fill="#1ed760" stroke="#0d1712" stroke-width="5">
    <rect x="129" y="176" width="62" height="54" rx="9"/>
    <rect x="132" y="164" width="19" height="22" rx="6"/>
    <rect x="169" y="164" width="19" height="22" rx="6"/>
  </g>
  <g fill="#0d1712">
    <rect x="138" y="170" width="7" height="8" rx="2"/>
    <rect x="175" y="170" width="7" height="8" rx="2"/>
    <rect x="148" y="202" width="9" height="7"/>
    <rect x="164" y="202" width="9" height="7"/>
  </g>
  <g fill="#e8f0ec">
    <rect x="43" y="243" width="18" height="18" rx="3"/>
    <rect x="263" y="82" width="18" height="18" rx="3"/>
  </g>
</svg>
